<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ErgoSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="9" cy="3.5" r="2"/><path d="M9 6v6l-3 4M9 12l3 4M5 8.5h8"/></svg></div>
      <span class="brand-name">ErgoSense</span>
    </div>
    <p class="brand-sub">Office Ergonomics &amp; Well-Being · OH – HSE</p>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot"><div class="avatar" id="who-av">–</div><div class="who"><b id="who-name"></b><span id="who-role"></span></div><button class="link" id="sign-out">Sign out</button></div>
  </aside>
  <div class="main">
    <div class="topbar"><span class="crumb" id="crumb"></span><span class="mode-chip" id="mode-chip">Starting…</span></div>
    <main class="view" id="view"><p class="muted">Loading…</p></main>
  </div>
</div>
<div id="notify-root"></div>
<div id="toast-root"></div>
<noscript>ErgoSense needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
