<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<meta charset="utf-8">
<title>ErgoSense Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: fixed role sidebar + flat working canvas; hairlines do the structure, blue marks action, semantic colours mark risk */
:root{
  --bg:#ffffff; --surface:#ffffff; --tint:#EEF5FF; --tint-2:#D9E9FF;
  --fg:#141A1D; --body:#37464F; --muted:#6B767D; --rule:#DCDFE0;
  --accent:#2979FF; --accent-hover:#1A6EFF; --btn:#222C31; --btn-hover:#141A1D; --on-btn:#ffffff;
  --high:#D93A2B; --high-bg:#FDECEA; --med:#B26A00; --med-bg:#FFF4CC; --low:#2E7D32; --low-bg:#E8F5E9;
  --figure:#37464F; --scrim:rgba(20,26,29,.45);
  --display:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --text:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:180ms cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1518; --surface:#141C20; --tint:#162334; --tint-2:#1C2E47;
  --fg:#EEF2F4; --body:#C3CCD1; --muted:#8C979D; --rule:#2A353B;
  --accent:#5C9BFF; --accent-hover:#7DB0FF; --btn:#EEF2F4; --btn-hover:#ffffff; --on-btn:#141A1D;
  --high:#FF7A6B; --high-bg:#3A1C19; --med:#F2B54A; --med-bg:#3A2E12; --low:#6FCF76; --low-bg:#173020;
  --figure:#C3CCD1; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1518; --surface:#141C20; --tint:#162334; --tint-2:#1C2E47;
  --fg:#EEF2F4; --body:#C3CCD1; --muted:#8C979D; --rule:#2A353B;
  --accent:#5C9BFF; --accent-hover:#7DB0FF; --btn:#EEF2F4; --btn-hover:#ffffff; --on-btn:#141A1D;
  --high:#FF7A6B; --high-bg:#3A1C19; --med:#F2B54A; --med-bg:#3A2E12; --low:#6FCF76; --low-bg:#173020;
  --figure:#C3CCD1; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--body);font:400 14px/1.857 var(--text)}
h1,h2,h3,h4{color:var(--fg);font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1.25;letter-spacing:-.02em}
h2{font-size:20px;line-height:1.4;letter-spacing:-.01em}
h3{font-size:16px;line-height:1.5}
p{margin:0}
a{color:var(--accent);text-decoration:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font:500 12px/1.5 var(--ui);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--rule);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:28px;height:28px;background:var(--accent);display:grid;place-items:center}
.brand-name{font:500 18px/1 var(--display);color:var(--fg);letter-spacing:-.01em}
.brand-sub{font:400 11px/1.4 var(--ui);color:var(--muted);padding:0 8px;margin-top:-16px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule)}
.roles button{background:none;border:0;padding:8px 4px;font:500 12px/1.4 var(--ui);cursor:pointer;color:var(--body);transition:background var(--ease)}
.roles button+button{border-left:1px solid var(--rule)}
.roles button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;color:var(--body);font-weight:500;border-left:2px solid transparent;transition:background var(--ease),color var(--ease)}
.nav a:hover{background:var(--tint)}
.nav a[aria-current="page"]{color:var(--accent);background:var(--tint);border-left-color:var(--accent)}
.nav svg{flex:none}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--rule);display:flex;gap:10px;align-items:center}
.avatar{width:32px;height:32px;background:var(--tint-2);color:var(--accent);display:grid;place-items:center;font:500 12px/1 var(--ui);flex:none}
.who b{display:block;color:var(--fg);font-weight:500;line-height:1.3}
.who span{font:400 12px/1.4 var(--ui);color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-block:14px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.crumb{font:500 13px/1.4 var(--ui);color:var(--muted)}
.demo-chip{font:500 12px/1 var(--ui);background:var(--med-bg);color:var(--med);padding:6px 10px}
.view{padding-block:32px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px;max-width:1240px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head p{max-width:62ch;margin-top:6px}

/* building blocks */
.card{border:1px solid var(--rule);background:var(--surface);padding:24px;min-width:0}
.card.tint{background:var(--tint);border-color:var(--tint-2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--on-btn);border:1px solid var(--btn);padding:11px 20px;font:500 14px/1.4 var(--text);cursor:pointer;transition:background var(--ease),border-color var(--ease)}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn.blue{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.blue:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.ghost:hover{background:var(--tint)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.link:hover{color:var(--accent-hover)}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--ui);padding:5px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;background:currentColor}
.High{color:var(--high);background:var(--high-bg)}
.Medium{color:var(--med);background:var(--med-bg)}
.Low{color:var(--low);background:var(--low-bg)}
.Info{color:var(--accent);background:var(--tint)}
.kpi .v{font:300 40px/1.1 var(--display);color:var(--fg);letter-spacing:-.03em}
.kpi .v small{font-size:16px;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .d{font:400 12px/1.5 var(--ui);color:var(--muted);margin-top:6px}
.bar{height:6px;background:var(--tint-2);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar.target b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
table{width:100%;border-collapse:collapse}
th{font:500 12px/1.4 var(--ui);color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:hover{background:var(--tint)}
.tbl{overflow-x:auto;border:1px solid var(--rule)}
.tbl table td:first-child,.tbl table th:first-child{padding-left:20px}
select,input[type="text"],input[type="time"]{background:var(--surface);border:1px solid var(--rule);padding:8px 10px;border-radius:0}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font:500 12px/1.4 var(--ui);color:var(--muted)}
.divider{height:1px;background:var(--rule)}
.svgc{width:100%;height:auto;display:block;max-width:100%}

/* self-assessment */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule)}
.steps button{background:var(--surface);border:0;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.steps button+button{border-left:1px solid var(--rule)}
.steps button[aria-current="step"]{background:var(--tint);box-shadow:inset 0 -2px 0 var(--accent)}
.steps .n{font:500 12px/1.4 var(--ui);color:var(--muted)}
.steps .t{font-weight:500;color:var(--fg)}
.steps .done .n{color:var(--low)}
.q{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.q:last-child{border-bottom:0}
.q p{color:var(--fg);flex:1 1 280px}
.seg{display:inline-grid;grid-template-columns:repeat(3,auto);border:1px solid var(--rule)}
.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;font:500 13px/1.4 var(--ui);color:var(--body)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}

/* capture */
.drop{border:1px dashed var(--accent);background:var(--tint);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.drop img{width:100%;height:100%;object-fit:cover}
.frame-guide{position:absolute;inset:8%;border:1px dashed var(--accent);pointer-events:none}
.frame-guide span{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font:500 11px/1 var(--ui);padding:5px 8px}
.progress{height:4px;background:var(--tint-2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width 300ms linear}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:6px;accent-color:var(--accent)}

/* findings */
.finding{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule);align-items:start}
.finding:last-child{border-bottom:0}
.sev{width:4px;align-self:stretch}
.sev.High{background:var(--high)}.sev.Medium{background:var(--med)}.sev.Low{background:var(--low)}
.finding h3{font-size:15px}
.measure{font:500 12px/1.4 var(--ui);color:var(--muted)}
.score-ring{display:flex;align-items:center;gap:20px}
.rec{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule)}
.rec:last-child{border-bottom:0}
.rec input{margin-top:6px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.rec.done p:first-of-type{text-decoration:line-through;color:var(--muted)}

/* reminders */
.profiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--rule)}
.profiles button{background:var(--surface);border:0;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.profiles button+button{border-left:1px solid var(--rule)}
.profiles button[aria-pressed="true"]{background:var(--tint);box-shadow:inset 0 -2px 0 var(--accent)}
.profiles b{font-weight:500;color:var(--fg)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:12px;align-items:center}
input[type="range"]{width:100%;accent-color:var(--accent)}
.ex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.ex .card{border-top:0;border-left:0;transition:background var(--ease)}
.ex .card:hover{background:var(--tint)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--rule);background:var(--surface);padding:6px 12px;cursor:pointer;font:500 12px/1.4 var(--ui)}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--tint)}

/* reminder popup + toast */
.notify{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--rule);box-shadow:0 12px 32px rgba(20,26,29,.18);z-index:30}
.notify header{display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:#fff;padding:8px 14px;font:500 12px/1.4 var(--ui)}
.notify header button{background:none;border:0;color:#fff;cursor:pointer;font-size:18px;line-height:1}
.notify .body{padding:18px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--on-btn);padding:12px 18px;font:500 13px/1.4 var(--ui);z-index:40;max-width:calc(100vw - 32px)}

/* charts */
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 44px;gap:12px;align-items:center;padding:7px 0}
.hbar .track{height:10px;background:var(--tint)}
.hbar .track i{display:block;height:100%;background:var(--accent)}
.hbar .val{text-align:right;font:500 12px/1 var(--ui);color:var(--fg)}
.hbar .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:400 12px/1.4 var(--ui);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--low);font-weight:500}.no{color:var(--muted)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--tint);border:1px solid var(--tint-2);color:var(--fg)}

.app.signin{grid-template-columns:minmax(0,1fr)}
.app.signin .side{display:none}
.signin-card{max-width:440px;width:100%;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.side-foot .link{margin-left:auto;font-size:12px}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:14px}
  .brand-sub,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}
  .nav a[aria-current="page"]{border-bottom-color:var(--accent)}
  .topbar,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2,.g4{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps button:nth-child(3){border-left:0}
  .steps button:nth-child(n+3){border-top:1px solid var(--rule)}
  .profiles,.ex{grid-template-columns:minmax(0,1fr)}
  .profiles button+button{border-left:0;border-top:1px solid var(--rule)}
  .hbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 40px}
  h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="9" cy="3.5" r="2"/><path d="M9 6v6l-3 4M9 12l3 4M5 8.5h8"/></svg></div>
      <span class="brand-name">ErgoSense</span>
    </div>
    <p class="brand-sub">Office Ergonomics &amp; Well-Being · OH – HSE</p>
    <div>
      <div class="label" style="margin:0 0 6px 2px">View as</div>
      <div class="roles" role="group" aria-label="Role">
        <button type="button" id="role-employee" data-role="employee">Employee</button>
        <button type="button" id="role-hse" data-role="hse">HSE / OH</button>
        <button type="button" id="role-admin" data-role="admin">Admin</button>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot"><div class="avatar" id="who-av">SH</div><div class="who"><b id="who-name">Sara Haddad</b><span id="who-role">Research Office</span></div><a class="link" href="#signin">Sign out</a></div>
  </aside>
  <div class="main">
    <div class="topbar"><span class="crumb" id="crumb">Home</span><span class="demo-chip">Prototype · sample data</span></div>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="notify-root"></div>
<div id="toast-root"></div>

<script>
/* ---------- icons (1.5px stroke, 20px grid) ---------- */
const P = {
  home:'M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z',
  check:'M6 3h8a1 1 0 0 1 1 1v13H5V4a1 1 0 0 1 1-1zM8 3v2h4V3M7.5 10l1.8 1.8L13 8',
  camera:'M3 7h3l1.5-2h5L14 7h3v9H3zM10 14a2.6 2.6 0 1 0 0-5.2A2.6 2.6 0 0 0 10 14z',
  report:'M5 3h7l3 3v11H5zM12 3v3h3M8 10h5M8 13h5',
  bell:'M5 14V9a5 5 0 0 1 10 0v5l1.5 2h-13zM8.5 17.5a1.8 1.8 0 0 0 3 0',
  grid:'M3 3h6v6H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 11h6v6H3z',
  alert:'M10 3 18 17H2zM10 8v4M10 14.5v.5',
  flag:'M5 17V3M5 4h10l-2 3.5L15 11H5',
  users:'M7.5 9a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6zM2.5 16.5c.6-3 2.6-4.5 5-4.5s4.4 1.5 5 4.5M13 4a2.6 2.6 0 0 1 0 5M15 12c1.4.6 2.2 2 2.5 4.5',
  shield:'M10 2.5 16 5v5c0 3.8-2.6 6.4-6 7.5-3.4-1.1-6-3.7-6-7.5V5z',
  list:'M7 5h10M7 10h10M7 15h10M3 5h1M3 10h1M3 15h1',
  arrow:'M6 14 14 6M7.5 6H14v6.5',
  upload:'M10 13V4M6.5 7.5 10 4l3.5 3.5M4 13v3h12v-3',
  play:'M7 5v10l8-5z',
  info:'M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM10 9v4.5M10 6.5v.5'
};
const ic = (n,s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- sample data ---------- */
const USERS = {
  employee:{name:'Sara Haddad',init:'SH',sub:'Research Office · Science Park'},
  hse:{name:'Dr. Omar Nasser',init:'ON',sub:'Occupational Health – HSE'},
  admin:{name:'Lina Karam',init:'LK',sub:'System administrator'}
};
const AREAS = [
  {area:'Sitting posture',sev:'High',title:'Forward head and rounded upper back',measure:'Neck flexion 31° · trunk lean 14°',detail:'Your head sits about 6 cm forward of your shoulders. Sustained neck flexion above 20° raises neck and shoulder strain.'},

function scoreDial(v,cls){

}

function spark(arr,w=96,h=28){
  const min=50,max=80, x=i=>i*(w-6)/(arr.length-1)+3, y=v=>h-3-(v-min)/(max-min)*(h-6);
  const d = arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${x(arr.length-1)} ${h} L3 ${h}Z" fill="var(--tint)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="${x(arr.length-1)}" cy="${y(arr.at(-1))}" r="2.5" fill="var(--accent)"/></svg>`;
}

function lineChart(series){
  const W=560,H=220,L=36,R=12,T=14,B=28, min=50,max=80;
  const x=i=>L+i*(W-L-R)/(MONTHS.length-1), y=v=>T+(max-v)/(max-min)*(H-T-B);
  let g='';
  for(let v=50; v<=80; v+=10) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Inter,sans-serif">${v}</text>`;
  g += MONTHS.map((m,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Inter,sans-serif">${m}</text>`).join('');
  const target = `<line x1="${L}" x2="${W-R}" y1="${y(70)}" y2="${y(70)}" stroke="var(--fg)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-R}" y="${y(70)-6}" text-anchor="end" font-size="10.5" fill="var(--fg)" font-family="Inter,sans-serif">Pilot target 70</text>`;
  const paths = series.map((s,k)=>{
    const d = s.v.map((v,i)=>`${i?'L':'M'}${x(i)} ${y(v)}`).join(' ');
    const col = k===0?'var(--accent)':'var(--muted)';
    return (k===0?`<path d="${d} L${x(s.v.length-1)} ${y(min)} L${x(0)} ${y(min)}Z" fill="var(--tint)" opacity=".8"/>`:'') +
      `<path d="${d}" fill="none" stroke="${col}" stroke-width="${k===0?2.5:1.5}" ${k?'stroke-dasharray="2 3"':''}/>` +
      `<circle cx="${x(s.v.length-1)}" cy="${y(s.v.at(-1))}" r="${k===0?4:3}" fill="${col}"/><text x="${x(s.v.length-1)-8}" y="${y(s.v.at(-1))-9}" text-anchor="end" font-size="11" font-weight="500" fill="${col}" font-family="Inter,sans-serif">${s.v.at(-1)}</text>`;
  }).join('');
  return `<svg class="svgc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average ergonomic score by month">${g}${target}${paths}</svg>`;
}

  v.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;render();});
  v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.answers[b.dataset.q]=b.dataset.a; if(answered()===12) S.checkError=null; render();});

  const f=v.querySelector('#finish'); if(f) f.onclick=()=>{

};

    <div class="card" style="padding:0"><div style="padding:24px 24px 8px"><h2>Department trends</h2></div><div style="overflow-x:auto"><table><thead><tr><th style="padding-left:24px">Department</th><th>Assessed</th><th>High risk</th><th>Score</th><th>Jul–Nov</th></tr></thead><tbody>
      ${ds.map(d=>`<tr><td style="padding-left:24px;color:var(--fg)">${d.name}<br><span class="muted" style="font-size:12px">${d.entity}</span></td><td class="num">${Math.round(d.assessed/d.emp*100)}%</td><td class="num">${Math.round(d.high/d.assessed*100)}%</td><td class="num" style="color:var(--fg);font-weight:500">${d.trend.at(-1)}</td><td>${spark(d.trend)}</td></tr>`).join('')}
    </tbody></table></div></div>
  </div>`;
};
BIND.hse = v => {
  v.querySelector('#f-entity').onchange=e=>{S.entity=e.target.value; if(S.dept!=='All'&&DEPTS.find(d=>d.name===S.dept).entity!==S.entity&&S.entity!=='All') S.dept='All'; render();};
  v.querySelector('#f-dept').onchange=e=>{S.dept=e.target.value;render();};
  v.querySelector('#f-period').onchange=e=>{S.period=e.target.value;render();};
};

VIEWS.cases = () => `
  <div class="head"><div><h1>High-risk follow-up</h1><p>Employees whose latest assessment is High or Medium risk. Opening an individual report is recorded in the audit log.</p></div>
  <button class="btn ghost" data-export="Excel">Export list</button></div>
  <div class="grid g3">
    <div class="card kpi"><div class="label">New</div><div class="v num">${CASES.filter(c=>c.status==='New').length}</div><div class="d">Not yet contacted</div></div>
    <div class="card kpi"><div class="label">Contacted</div><div class="v num">${CASES.filter(c=>c.status==='Contacted').length}</div><div class="d">Awaiting workstation change</div></div>
    <div class="card kpi"><div class="label">Resolved</div><div class="v num">${CASES.filter(c=>c.status==='Resolved').length}</div><div class="d">Re-assessed at lower risk</div></div>
  </div>
  <div class="row" style="gap:16px">
    <label class="field"><span>Risk class</span><select id="c-risk">${['All','High','Medium'].map(o=>`<option ${S.cRisk===o?'selected':''}>${o}</option>`).join('')}</select></label>
    <label class="field"><span>Department</span><select id="c-dept"><option>All</option>${DEPTS.map(d=>`<option ${S.cDept===d.name?'selected':''}>${d.name}</option>`).join('')}</select></label>
    <label class="field"><span>Status</span><select id="c-stat">${['All','New','Contacted','Resolved'].map(o=>`<option ${S.cStatus===o?'selected':''}>${o}</option>`).join('')}</select></label>
  </div>
  <div class="tbl"><table><thead><tr><th>Employee</th><th>Department</th><th>Risk</th><th>Score</th><th>Top issue</th><th>Assessed</th><th>Status</th><th></th></tr></thead><tbody>
  ${(()=>{const rows=CASES.filter(c=>(S.cRisk==='All'||c.cls===S.cRisk)&&(S.cDept==='All'||c.dept===S.cDept)&&(S.cStatus==='All'||c.status===S.cStatus));
    return rows.length?'':`<tr><td colspan="8" class="muted" style="padding:28px 20px">No employees match these filters. <button class="link" id="c-clear">Clear filters</button></td></tr>`;})()}
  ${CASES.filter(c=>(S.cRisk==='All'||c.cls===S.cRisk)&&(S.cDept==='All'||c.dept===S.cDept)&&(S.cStatus==='All'||c.status===S.cStatus)).map(c=>`<tr><td style="color:var(--fg)">${c.name}<br><span class="muted" style="font-size:12px">${c.id.toUpperCase()}</span></td><td>${c.dept}</td><td>${pill(c.cls)}</td><td class="num" style="color:var(--fg)">${c.score}</td><td>${c.issue}</td><td class="num">${c.date}</td><td><span class="pill ${c.status==='Resolved'?'Low':c.status==='Contacted'?'Info':'Medium'}">${c.status}</span></td><td><a class="link" href="#case-${c.id}">Open ${ic('arrow',14)}</a></td></tr>`).join('')}
  </tbody></table></div>`;

BIND.cases = v => {
  v.querySelector('#c-risk').onchange=e=>{S.cRisk=e.target.value;render();};
  v.querySelector('#c-dept').onchange=e=>{S.cDept=e.target.value;render();};
  v.querySelector('#c-stat').onchange=e=>{S.cStatus=e.target.value;render();};
  const c=v.querySelector('#c-clear'); if(c) c.onclick=()=>{S.cRisk=S.cDept=S.cStatus='All';render();};
};

VIEWS.case = () => {
  const c = CASES.find(x=>x.id===S.caseId) || CASES[0];
  return `
  <div class="head"><div><button class="link" data-go="cases" style="margin-bottom:8px">← High-risk follow-up</button><h1>${c.name}</h1><p>${c.dept} · ${c.id.toUpperCase()} · Your access to this report has been recorded in the audit log.</p></div>
  <div class="row"><label class="field"><span>Follow-up status</span><select id="c-status">${['New','Contacted','Resolved'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></label><button class="btn ghost" data-export="PDF">Export PDF</button></div></div>
  ${reportBody(c,false)}`;
};
BIND.case = v => { v.querySelector('#c-status').onchange = e => { const c = CASES.find(x=>x.id===S.caseId); if(c){c.status=e.target.value; toast(`Status set to ${c.status}.`);} }; };

VIEWS.pilot = () => {
  const K = [['Pilot employees assessed','86%',86,80,'≥ 80%','Low'],['Average time per assessment','7 min 40 s',77,100,'≤ 10 min','Low'],['Moved to a lower risk class','37%',37,40,'≥ 40%','Medium'],['Reminder engagement','54%',54,50,'≥ 50%','Low'],['Employee satisfaction','4.3 / 5',86,80,'≥ 4 / 5','Low']];
  return `
  <div class="head"><div><h1>Pilot evaluation</h1><p>480 employees across 3 entities, Jul 14 – Dec 12, 2026. Progress against the targets agreed for the rollout decision.</p></div>
  <button class="btn blue" data-export="evaluation report (PDF)">${ic('report',18)} Generate evaluation report</button></div>
  <div class="card" style="padding:0"><div style="overflow-x:auto"><table><thead><tr><th style="padding-left:24px">Success metric</th><th>Result</th><th style="min-width:200px">Progress to target</th><th>Target</th><th>Status</th></tr></thead><tbody>
  ${K.map(([n,v,p,t,tl,c])=>`<tr><td style="padding-left:24px;color:var(--fg)">${n}</td><td class="num" style="color:var(--fg);font-weight:500">${v}</td><td><div class="bar target"><i style="width:${Math.min(p,100)}%;${c==='Medium'?'background:var(--med)':''}"></i><b style="left:${t}%"></b></div></td><td class="num">${tl}</td><td><span class="pill ${c}">${c==='Low'?'On target':'Behind'}</span></td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="grid g2">
    <div class="card"><h2>Timeline</h2><div class="stack" style="margin-top:12px">
      ${[['Kick-off and integration','Done','Low','SSO, HR import, hosting in approved region'],['Commissioning and SAT','Done','Low','Signed off Jul 10'],['Pilot live, 480 users','In progress','Info','Week 16 of 22'],['Quarterly re-assessment','In progress','Info','212 of 412 re-assessed'],['Evaluation report and rollout decision','Dec 2026','Medium','Scale to 4,000–5,000 employees']].map(([a,s,c,d])=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="pill ${c}" style="min-width:96px">${s}</span><div><p style="color:var(--fg)">${a}</p><p class="muted" style="font-size:12px">${d}</p></div></div>`).join('')}
    </div></div>
    <div class="card tint stack"><div class="label">Reading the results</div><h2>Re-assessments are behind the risk target</h2><p>37% of re-assessed employees moved to a lower risk class against a 40% target. 200 re-assessments are still due before Dec 12. Employees who completed the monitor recommendation improved 3 times more often than those who did not.</p><button class="link" data-go="cases">Prioritise open high-risk cases ${ic('arrow',16)}</button></div>
  </div>`;
};

/* ---------- Admin ---------- */
VIEWS.users = () => `
  <div class="head"><div><h1>Users &amp; departments</h1><p>Users sign in with company SSO. Department and entity come from the HR file and drive all reporting.</p></div></div>
  <div class="grid g-main">
    <div class="card stack"><div class="row between"><h2>Import from HR</h2><span class="muted" style="font-size:12px">Last sync Nov 5, 16:03</span></div>
      <p>Upload a CSV with <code>email, department, entity, role, cohort</code>. Existing users are updated, nobody is deleted.</p>
      <div class="row"><label class="btn ghost sm" for="csv-in" style="cursor:pointer">${ic('upload',16)} Choose CSV file</label><input type="file" id="csv-in" accept=".csv,text/csv" hidden><button class="btn sm" id="csv-sample">Use sample file</button></div>

BIND.users = v => {
  v.querySelector('#csv-in').onchange = e => { const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const n=r.result.split(/\r?\n/).filter(l=>l.trim()).length-1; S.imported=`${f.name}: ${Math.max(n,0)} rows read. In the live product they are checked and applied after you confirm.`; render(); }; r.readAsText(f); };
  v.querySelector('#csv-sample').onclick = () => { S.imported = 'hr_export_nov.csv: 38 rows read · 36 unchanged · 2 department changes. Applied.'; render(); };
  v.querySelectorAll('[data-u]').forEach(s=>s.onchange=()=>{ ADMIN_USERS[s.dataset.u][4]=s.value; toast(`${ADMIN_USERS[s.dataset.u][0]} is now ${s.value}. Change logged.`); });
  v.querySelectorAll('[data-cohort]').forEach(s=>s.onchange=()=>{ ADMIN_USERS[s.dataset.cohort][5]=s.value; toast(s.value==='—'?`${ADMIN_USERS[s.dataset.cohort][0]} removed from the pilot.`:`${ADMIN_USERS[s.dataset.cohort][0]} added to ${s.value}.`); });
};

VIEWS.access = () => {
  const M = [['Own report and reminders','yes','yes','yes'],['Individual reports of others','no','yes','no'],['Aggregated dashboards','no','yes','yes'],['Export PDF / Excel','Own','yes','no'],['Manage users and roles','no','no','yes'],['Organisation policies','no','Propose','yes'],['View audit log','no','Own actions','yes']];
  const cell = x => x==='yes'?'<span class="yes">Yes</span>':x==='no'?'<span class="no">—</span>':`<span style="color:var(--fg)">${x}</span>`;
  return `
  <div class="head"><div><h1>Roles &amp; policies</h1><p>Admins manage the platform but cannot open individual ergonomic reports. Only the employee and authorised OH – HSE staff can.</p></div></div>
  <div class="tbl"><table class="matrix"><thead><tr><th>Permission</th><th>Employee</th><th>HSE / OH</th><th>Admin</th></tr></thead><tbody>${M.map(r=>`<tr><td style="color:var(--fg)">${r[0]}</td>${r.slice(1).map(c=>`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="card"><h2>Organisation policies</h2>
    <div class="grid g3" style="margin-top:16px">

      <label class="field"><span>Smallest group shown in dashboards</span><select id="p-min"><option>5 employees</option><option>10 employees</option></select></label>
      <label class="field"><span>Raw photos and videos</span><select id="p-raw"><option>Delete after analysis</option><option>Keep 30 days</option></select></label>
      <label class="field"><span>AI capture input</span><select id="p-cap"><option>Photo and video</option><option>Photo only</option><option>Self-assessment only</option></select></label>
      <label class="field"><span>Data hosting region</span><select id="p-reg"><option>Client-approved region</option></select></label>
    </div>
    <div class="row" style="margin-top:20px"><button class="btn" id="save-pol">Save policies</button><span class="muted" style="font-size:12px">Encryption at rest (AES-256) and in transit (TLS 1.2+) is always on.</span></div>
  </div>`;
};
BIND.access = v => v.querySelector('#save-pol').onclick = () => toast('Policies saved and logged.');

VIEWS.audit = () => `

VIEWS.signin = () => `
  <div class="card signin-card">

    <button class="btn blue" id="sso">${ic('shield',18)} Sign in with Client SSO</button>
    <div class="divider"></div>
    <div class="label">Demo: sign in as</div>
    <div class="roles" role="group" aria-label="Demo role">${['employee','hse','admin'].map(r=>`<button type="button" data-signin="${r}" aria-pressed="${S.role===r}">${{employee:'Employee',hse:'HSE / OH',admin:'Admin'}[r]}</button>`).join('')}</div>
    <p class="muted" style="font-size:12px">Single sign-on through the Client identity provider (SAML / OIDC). Sessions time out after 30 minutes of inactivity.</p>
  </div>`;
BIND.signin = v => {
  v.querySelectorAll('[data-signin]').forEach(b=>b.onclick=()=>{S.role=b.dataset.signin;render();});
  v.querySelector('#sso').onclick=()=>go(FIRST[S.role]);
};

/* global clicks */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const x = e.target.closest('[data-export]'); if(x){ toast(`In the live product this downloads the ${x.dataset.export}.`); }
});

render();
</script>
